name: dam_driver
description: DAMFlotte CLD - Driver Mobile App for Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.8.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.0

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  percent_indicator: ^4.2.3

  # Forms & Validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.0

  # Image & Files
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Utilities
  intl: any
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  permission_handler: ^11.4.0

  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
